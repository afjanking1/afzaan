<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity Flip</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #gameCanvas {
    border: 2px solid #333;
    border-radius: 8px;
    cursor: pointer;
  }
  #hud {
    color: #fff;
    margin-bottom: 10px;
    font-size: 18px;
    display: flex;
    gap: 30px;
  }
  #score { color: #00ffcc; }
  #best { color: #ff66aa; }
  #msg {
    color: #fff;
    font-size: 24px;
    margin-top: 10px;
    text-align: center;
    min-height: 30px;
  }
  #instructions {
    color: #888;
    font-size: 14px;
    margin-top: 5px;
  }
</style>
</head>
<body>
<div id="hud">
  <span>Score: <span id="score">0</span></span>
  <span>Best: <span id="best">0</span></span>
</div>
<canvas id="gameCanvas" width="600" height="400"></canvas>
<div id="msg">Click / Tap / Space to flip gravity</div>
<div id="instructions">Survive as long as you can! Spikes get faster & more.</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let ball = { x: W/2, y: H/2, r: 12, vy: 0, gravity: 1 };
let spikes = [];
let score = 0;
let best = 0;
let gameOver = false;
let startTime = 0;
let lastTime = 0;
let flipFlash = 0;
let particles = [];

function reset() {
  ball = { x: W/2, y: H/2, r: 12, vy: 0, gravity: 1 };
  spikes = [];
  score = 0;
  gameOver = false;
  particles = [];
  startTime = performance.now();
  lastTime = startTime;
  document.getElementById('msg').textContent = 'Click / Tap / Space to flip gravity';
}

function spawnSpikes() {
  const speed = 2 + score / 50;
  const side = Math.random() > 0.5 ? 0 : 1; // 0=floor, 1=ceiling
  const w = 20 + Math.random() * 40;
  const h = 30 + Math.random() * 50;
  const x = W + w;
  spikes.push({ x, y: side === 0 ? H - h : 0, w, h, side, speed });
  // Sometimes spawn a moving spike
  if (Math.random() > 0.6 && score > 10) {
    const mw = 15;
    const mh = 20 + Math.random() * 30;
    const my = side === 0 ? H - mh : 0;
    spikes.push({ x: W + mw + 100, y: my, w: mw, h: mh, side, speed: speed * 1.5, moving: true, phase: Math.random() * Math.PI * 2 });
  }
}
function flipGravity() {
  if (gameOver) { reset(); return; }
  ball.gravity *= -1;
  ball.vy = ball.gravity * 3;  // ← YEH LINE ADD KARO (instant nudge)
  flipFlash = 8;
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    particles.push({
      x: ball.x, y: ball.y,
      vx: Math.cos(angle) * 3,
      vy: Math.sin(angle) * 3,
      life: 20, color: ball.gravity === 1 ? '#ff4466' : '#44aaff'
    });
  }
}   

function update(dt) {
  if (gameOver) return;

  score = Math.floor((performance.now() - startTime) / 100);
  document.getElementById('score').textContent = score;

  // Ball physics
  ball.vy += ball.gravity * 0.4;
  ball.y += ball.vy;
  ball.x += Math.sin(performance.now() / 500) * 0.5; // slight drift

  // Floor/Ceiling bounce (only if not hitting spike)
  if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy = 0; }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = 0; }

  // Walls
  if (ball.x - ball.r < 0) { ball.x = ball.r; }
  if (ball.x + ball.r > W) { ball.x = W - ball.r; }

  // Spawn spikes
  if (Math.random() < 0.02 + score / 5000) spawnSpikes();

  // Update spikes
  for (let i = spikes.length - 1; i >= 0; i--) {
    const s = spikes[i];
    s.x -= s.speed;
    if (s.moving) {
      s.phase += 0.05;
      s.y += Math.sin(s.phase) * 2 * (s.side === 0 ? 1 : -1);
    }
    if (s.x + s.w < 0) spikes.splice(i, 1);

    // Collision
    if (ball.x + ball.r > s.x && ball.x - ball.r < s.x + s.w &&
        ball.y + ball.r > s.y && ball.y - ball.r < s.y + s.h) {
      gameOver = true;
      if (score > best) { best = score; document.getElementById('best').textContent = best; }
      document.getElementById('msg').textContent = `💀 Game Over! Score: ${score} — Click to restart`;
      // Explosion particles
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 4;
        particles.push({
          x: ball.x, y: ball.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 30, color: '#ff4444'
        });
      }
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (flipFlash > 0) flipFlash--;
}

function draw() {
  // Background
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = '#1a1a3a';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Gravity indicator
  const gravColor = ball.gravity === 1 ? '#ff446633' : '#44aaff33';
  const gravY = ball.gravity === 1 ? H/2 : 0;
  const gravH = H/2;
  ctx.fillStyle = gravColor;
  ctx.fillRect(0, gravY, W, gravH);

  // Spikes
  spikes.forEach(s => {
    const grad = ctx.createLinearGradient(s.x, s.y, s.x, s.y + s.h);
    if (s.side === 0) {
      grad.addColorStop(0, '#ff2244');
      grad.addColorStop(1, '#881122');
    } else {
      grad.addColorStop(0, '#881122');
      grad.addColorStop(1, '#ff2244');
    }
    ctx.fillStyle = grad;
    // Draw as triangles
    const numTeeth = Math.floor(s.w / 15);
    const toothW = s.w / numTeeth;
    ctx.beginPath();
    if (s.side === 0) {
      ctx.moveTo(s.x, H);
      for (let i = 0; i < numTeeth; i++) {
        ctx.lineTo(s.x + i * toothW + toothW/2, s.y);
        ctx.lineTo(s.x + (i+1) * toothW, H);
      }
    } else {
      ctx.moveTo(s.x, 0);
      for (let i = 0; i < numTeeth; i++) {
        ctx.lineTo(s.x + i * toothW + toothW/2, s.y + s.h);
        ctx.lineTo(s.x + (i+1) * toothW, 0);
      }
    }
    ctx.closePath();
    ctx.fill();
  });

  // Ball
  const ballColor = ball.gravity === 1 ? '#ff6688' : '#66ccff';
  const glow = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.r * 2);
  glow.addColorStop(0, ballColor);
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r * 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = ballColor;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();

  // Ball inner
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r * 0.4, 0, Math.PI * 2);
  ctx.fill();

  // Flip flash
  if (flipFlash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flipFlash / 20})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life / 30;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Game over overlay
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2 - 20);
    ctx.font = '20px Courier New';
    ctx.fillText(`Score: ${score}`, W/2, H/2 + 20);
    ctx.font = '16px Courier New';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Click to restart', W/2, H/2 + 50);
  }
}

function loop() {
  const now = performance.now();
  const dt = now - lastTime;
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// Input
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); flipGravity(); }
});
canvas.addEventListener('click', flipGravity);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flipGravity(); });

reset();
loop();
</script>
</body>
</html>
