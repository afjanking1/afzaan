<!DOCTYPE html>
<html lang="hi">

<head>
  <link rel="canonical" href="https://afjan.studio" />

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Games</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #00d4ff;
    }

    .game-list {
      max-width: 600px;
      margin: 0 auto;
    }

    .game-card {
      background: #16213e;
      border-radius: 10px;
      padding: 15px 20px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
    }

    .game-card:hover {
      transform: scale(1.02);
    }

    .game-name {
      font-size: 18px;
      font-weight: bold;
    }

    .game-size {
      font-size: 13px;
      color: #888;
    }

    .download-btn {
      background: #00d4ff;
      color: #1a1a2e;
      padding: 8px 18px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
    }

    .download-btn:hover {
      background: #00a8cc;
    }
  </style>
</head>

<body>
  <h1>🎮 Games</h1>
  <div class="game-list">

    <!-- Game 1 -->
    <div class="game-card">
      <div>
        <div class="game-name">Neon Runway</div>
        <div class="game-size">Browser Game only for playing</div>
      </div>
      <a href="https://neon-runway.netlify.app/" class="download-btn">Play Now</a>
    </div>

    <!-- Game 2 (apna game yahan add karo) -->
    <div class="game-card">
      <div>
        <div class="game-name">gravity flipper</div>
        <div class="game-size">Browser Game only for playing</div>
      </div>
      <a href="gravity-flipper.html" class="download-btn">play now</a>
    </div>

    <!-- Game 3 -->
    <div class="game-card">
      <div>
        <div class="game-name">flappy bird</div>
        <div class="game-size">Browser Game only for playing</div>
      </div>
      <a href="flappy.html" class="download-btn">play now</a>
    </div>

  </div>
</body>

</html>
